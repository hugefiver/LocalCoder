[package]
name = "rustpython-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RustPython runner (note: compile time can be heavy)
# freeze-stdlib embeds the Python stdlib into the binary
rustpython = { version = "=0.5.0", default-features = false, features = ["freeze-stdlib", "stdio"] }
