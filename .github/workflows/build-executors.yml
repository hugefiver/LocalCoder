name: Runtime capability checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支/标签/提交（例如 master、feature/foo、v1.2.3、或 SHA）"
        required: true
        default: "master"
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        type: string

jobs:
  runtime-capabilities:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy TypeScript runtime asset
        run: node scripts/copy-typescript-asset.mjs

      - name: Setup Pyodide runtime assets
        run: node scripts/setup-pyodide.js --skip-typescript

      - name: Generate worker assets
        run: node scripts/build-worker-assets.mjs

      - name: Generate runtime manifest
        run: node scripts/generate-runtime-manifest.mjs

      - name: Report runtime capabilities
        run: node scripts/report-runtime-capabilities.mjs --github-summary
