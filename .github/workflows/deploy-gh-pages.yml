name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: "要发布的分支/标签/提交（例如 master、feature/foo、v1.2.3、或 SHA）"
        required: true
        default: "master"

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy TypeScript runtime asset
        run: node scripts/copy-typescript-asset.mjs

      - name: Setup Pyodide runtime assets
        run: node scripts/setup-pyodide.js --skip-typescript

      - name: Generate worker assets
        run: node scripts/build-worker-assets.mjs

      - name: Generate runtime manifest
        run: node scripts/generate-runtime-manifest.mjs

      - name: Report runtime capabilities
        run: node scripts/report-runtime-capabilities.mjs --github-summary

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build GitHub Pages distribution
        env:
          GITHUB_PAGES: "true"
          VITE_GITHUB_PAGES: "true"
        run: npm run build

      - name: Check packaged runtime assets
        run: node scripts/check-runtime-assets.mjs dist

      - name: Smoke check Pages distribution
        env:
          GITHUB_PAGES: "true"
        run: npm run smoke

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.0
