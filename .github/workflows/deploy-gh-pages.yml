name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: "要发布的分支/标签/提交（例如 master、feature/foo、v1.2.3、或 SHA）"
        required: true
        default: "master"

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          lfs: true

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2.0.2
        with:
          version: 12.0.0
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy TypeScript runtime asset
        run: node scripts/copy-typescript-asset.mjs

      - name: Setup Pyodide runtime assets
        run: node scripts/setup-pyodide.js --skip-typescript

      - name: Generate worker assets
        run: node scripts/build-worker-assets.mjs

      - name: Generate runtime manifest
        run: node scripts/generate-runtime-manifest.mjs

      - name: Report runtime capabilities
        run: node scripts/report-runtime-capabilities.mjs --github-summary

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

      - name: Build GitHub Pages distribution
        env:
          GITHUB_PAGES: "true"
          VITE_GITHUB_PAGES: "true"
        run: pnpm run build

      - name: Check packaged runtime assets
        run: node scripts/check-runtime-assets.mjs dist

      - name: Smoke check Pages distribution
        env:
          GITHUB_PAGES: "true"
        run: pnpm run smoke

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
